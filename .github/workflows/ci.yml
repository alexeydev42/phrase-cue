name: CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Test Yandex Cloud Function
        run: node --test server/yandex/*.node.cjs

      - name: Verify production translation URL
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TRANSLATION_API_URL: ${{ vars.PHRASECUE_YANDEX_TRANSLATION_URL }}
        run: |
          if [ -z "$TRANSLATION_API_URL" ]; then
            echo "::error::Set repository Actions variable PHRASECUE_YANDEX_TRANSLATION_URL"
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          VITE_TRANSLATION_API_URL: ${{ vars.PHRASECUE_YANDEX_TRANSLATION_URL }}
          VITE_TRANSLATION_FALLBACK_API_URL: https://phrase-cue-api.vercel.app/api/translate

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: true

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
